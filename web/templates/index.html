<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- 左栏：知识库管理 -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>📄 知识库</h2>
        </div>

        <!-- 拖拽上传区域 -->
        <div id="drop-zone" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            <div class="drop-icon">📁</div>
            <p>拖拽文件到此处上传</p>
            <p class="drop-hint">支持 txt / md / pdf</p>
            <input type="file" id="file-input" accept=".txt,.md,.pdf" onchange="handleFileSelect(event)" hidden
                multiple>
            <button onclick="document.getElementById('file-input').click()" class="btn-select">选择文件</button>
        </div>

        <!-- 已导入文件列表 -->
        <div id="file-list">
            <div class="file-list-title">已导入的文档</div>
            <div id="file-items">
                <div class="file-item-empty">暂无文档，请上传</div>
            </div>
        </div>
    </aside>

    <!-- 右栏：对话区 -->
    <main id="chat-area">
        <div class="chat-header">
            <h1>🔍 RAG 知识库</h1>
            <div class="user-panel">
                <span id="current-user" class="current-user">加载用户中...</span>
                <button onclick="logout()" class="btn-logout">退出登录</button>
            </div>
        </div>

        <!-- 消息列表 -->
        <div id="messages">
            <div class="message welcome">
                <div class="msg-avatar">🤖</div>
                <div class="msg-content">
                    <p>你好！我是知识助手。</p>
                    <p>请在左下角输入你的问题，我会基于知识库为你回答。</p>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="chat-input">
            <input type="text" id="question-input" placeholder="请输问题..."
                onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()" id="send-btn">发送</button>
        </div>
    </main>

        <script>
        // ===== 会话 ID（页面加载时生成一次） =====
        const sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        let currentUserRole = 'user';
        let currentUsername = '';

        // ===== 当前登录用户 =====
        async function loadCurrentUser() {
            const res = await fetch('/api/user/me', { credentials: 'same-origin' });
            const data = await handleAuthResponse(res);
            if (!data) return false;

            currentUserRole = data.role || 'user';
            currentUsername = data.username || '';

            const userEl = document.getElementById('current-user');
            userEl.textContent = currentUsername
                ? currentUsername + ' · ' + (currentUserRole === 'admin' ? '管理员' : '普通用户')
                : (currentUserRole === 'admin' ? '管理员' : '普通用户');

            if (currentUserRole === 'admin') {
                document.body.classList.add('is-admin');
            }

            return true;
        }

        // ===== 文件上传 =====

        function isAllowedUploadFile(file) {
            const name = file.name.toLowerCase();
            return name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.pdf');
        }

        function uploadFile(file) {
            if (!isAllowedUploadFile(file)) {
                alert('只支持 txt / md / pdf 文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            fetch('/api/upload', { method: 'POST', body: formData, credentials: 'same-origin' })
                .then(handleAuthResponse)
                .then(data => {
                    if (!data) return;

                    if (data.ok) {
                        // 上传成功后直接加到列表，填充已知信息
                        addFileItem({
                            filename: data.filename,
                            chunk_count: data.chunk_count || data.chunkCount || 0,
                            created_at: '刚刚',
                            is_public: data.is_public === true || currentUserRole === 'admin',
                        });
                    } else {
                        alert('上传失败: ' + (data.msg || data.error));
                    }
                })
                .catch(err => alert('上传失败: ' + err));
        }

        function handleDrop(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            for (const file of files) {
                uploadFile(file);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            for (const file of files) {
                uploadFile(file);
            }
            e.target.value = '';
        }

        function isPublicFile(file) {
            return file.is_public === true || file.IsPublic === true;
        }

        // file 参数是对象：{filename, chunk_count, created_at, is_public}
        function addFileItem(file) {
            const container = document.getElementById('file-items');
            const empty = container.querySelector('.file-item-empty');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = 'file-item';

            const isPublic = isPublicFile(file);

            const span = document.createElement('span');
            span.className = 'file-item-text';
            span.textContent = '📎 ' + file.filename
                + ' · ' + (file.chunk_count || 0) + ' chunks'
                + ' · ' + (file.created_at || '');

            const tag = document.createElement('span');
            tag.className = isPublic ? 'file-tag file-tag-public' : 'file-tag file-tag-private';
            tag.textContent = isPublic ? '公共' : '私有';

            div.appendChild(span);

            const meta = document.createElement('div');
            meta.className = 'file-item-actions';
            meta.appendChild(tag);

            if (!isPublic || currentUserRole === 'admin') {
                const btn = document.createElement('button');
                btn.className = 'btn-delete-file';
                btn.textContent = '✕';
                btn.title = '删除此文档';
                btn.onclick = function () {
                    deleteFile(file.filename, div);
                };
                meta.appendChild(btn);
            }

            div.appendChild(meta);
            container.prepend(div);
        }

        function deleteFile(filename, domElement) {
            if (!confirm('确定要删除 "' + filename + '" 吗？此操作不可撤销。')) {
                return;
            }

            fetch('/api/file/' + encodeURIComponent(filename), { method: 'DELETE', credentials: 'same-origin' })
                .then(handleAuthResponse)
                .then(data => {
                    if (!data) return;

                    if (data.ok) {
                        domElement.remove();

                        const container = document.getElementById('file-items');
                        if (container.children.length === 0) {
                            const empty = document.createElement('div');
                            empty.className = 'file-item-empty';
                            empty.textContent = '暂无文档，请上传';
                            container.appendChild(empty);
                        }
                    } else {
                        alert('删除失败: ' + (data.msg || '未知错误'));
                    }
                })
                .catch(err => alert('删除失败: ' + err));
        }

        // ===== 聊天 =====

        function sendMessage() {
            const input = document.getElementById('question-input');
            const question = input.value.trim();
            if (!question) return;

            // 显示用户消息
            appendMessage('user', question);
            input.value = '';
            input.disabled = true;
            document.getElementById('send-btn').disabled = true;

            // 创建 AI 回答气泡
            const msgDiv = appendMessage('assistant', '');
            const contentDiv = msgDiv.querySelector('.msg-content');

            // SSE 流式接收（带上 session_id）
            const url = '/api/chat/stream?q=' + encodeURIComponent(question)
                + '&session_id=' + encodeURIComponent(sessionId);
            const eventSource = new EventSource(url);

            eventSource.addEventListener('token', function (e) {
                contentDiv.textContent += e.data;
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            });

            eventSource.addEventListener('sources', function (e) {
                try {
                    const sources = JSON.parse(e.data);
                    renderSources(contentDiv, sources);
                } catch (err) {
                    console.error('解析参考来源失败', err);
                }
            });

            eventSource.addEventListener('error', function (e) {
                contentDiv.textContent += ' [回答出错]';
                eventSource.close();
                input.disabled = false;
                document.getElementById('send-btn').disabled = false;
            });

            eventSource.addEventListener('done', function (e) {
                eventSource.close();
                input.disabled = false;
                document.getElementById('send-btn').disabled = false;
                input.focus();
            });
        }

        function appendMessage(role, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = '<div class="msg-avatar">' + (role === 'user' ? '👤' : '🤖') + '</div>' +
                '<div class="msg-content">' + text + '</div>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function renderSources(contentDiv, sources) {
            if (!sources || sources.length === 0) {
                return;
            }

            const oldSources = contentDiv.querySelector('.answer-sources');
            if (oldSources) {
                oldSources.remove();
            }

            const box = document.createElement('div');
            box.className = 'answer-sources';

            const title = document.createElement('div');
            title.className = 'answer-sources-title';
            title.textContent = '参考来源';
            box.appendChild(title);

            const list = document.createElement('div');
            list.className = 'answer-sources-list';

            for (const source of sources) {
                const item = document.createElement('div');
                item.className = 'answer-source-item';

                const scope = source.is_public ? '公共' : '私有';
                item.textContent = '[' + source.index + '] ' + source.filename + ' · ' + scope;

                list.appendChild(item);
            }

            box.appendChild(list);
            contentDiv.appendChild(box);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function handleAuthResponse(res) {
            if (res.status === 401) {
                window.location.href = '/login';
                return null;
            }

            return res.json();
        }

        function logout() {
            fetch('/api/logout', {
                method: 'POST',
                credentials: 'same-origin',
            }).finally(function () {
                window.location.href = '/login';
            });
        }

        // ===== 页面加载时读取已有文件 =====
        window.addEventListener('DOMContentLoaded', async function () {
            const ok = await loadCurrentUser();
            if (!ok) return;

            fetch('/api/file', { credentials: 'same-origin' })
                .then(handleAuthResponse)
                .then(data => {
                    if (!data) return;

                    if (data.files && data.files.length > 0) {
                        for (const f of data.files) {
                            addFileItem(f);
                        }
                    }
                });
        });
    </script>
</body>

</html>
